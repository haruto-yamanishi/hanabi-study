name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run content:audit
      - run: npm run learning:check
      - run: npm run bank:audit
      - run: npm run bank:check
      - run: npm run placement:check
      - run: npm run math:check
      - run: npm run build
